<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мой сайт</title>

<!-- Шрифт -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

<style>

/* ОБНУЛЕНИЕ */

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ОСНОВА */

body{

    font-family: 'Montserrat', sans-serif;

    height: 100vh;

    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    /* ===== КАРТИНКА ФОН ===== */

    background-image: url('projectimg.png.jpg');

    /* ======================== */

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;
}

/* ЗАТЕМНЕНИЕ */

.overlay{
    position: absolute;

    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.45);
}

/* ЛОГО */

.logo{

    position: absolute;

    top: 30px;

    width: 100%;

    text-align: center;

    color: white;

    font-size: 70px;

    font-weight: 500;

    letter-spacing: 14px;

    text-transform: uppercase;

    transform: scaleY(0.6);

    z-index: 2;
}

/* ЦЕНТР */

.hero{

    position: relative;

    z-index: 2;

    text-align: center;
}

/* ТЕКСТ */

.hero h2{

    color: white;

    font-size: 24px;

    font-weight: 300;

    letter-spacing: 6px;

    margin-bottom: 25px;
}

/* КНОПКА */

button{

    width: 220px;

    height: 55px;

    background: transparent;

    border: 1px solid white;

    color: white;

    font-size: 14px;

    letter-spacing: 3px;

    cursor: pointer;

    transition: 0.3s;
}

button:hover{

    background: white;

    color: black;
}

</style>
</head>

<body>

<!-- ЗАТЕМНЕНИЕ -->

<div class="overlay"></div>

<!-- ЛОГО -->

<h1 class="logo">Porsche</h1>

<!-- ЦЕНТР -->

<section class="hero">

    <h2>THERE IS NO SUBSTITUTE</h2>

    <button>
        DISCOVER
    </button>

</section>

</body>
</html>
